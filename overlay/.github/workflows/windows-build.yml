name: Build Windows portable application

on:
  push:
    branches:
      - 'codex/celechron-windows-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Compile, package, and check startup
        shell: powershell
        run: .\scripts\build-windows.ps1

      - name: Upload runnable package and matching source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Celechron-1.3.1-Windows-x64
          path: |
            dist/Celechron-1.3.1-Windows-x64.zip
            dist/Celechron-1.3.1-Windows-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Celechron-Windows-build-logs
          path: dist/logs/
          if-no-files-found: warn
          retention-days: 14
