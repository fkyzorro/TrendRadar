name: Build Windows portable application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out original Celechron 1.3.1 source
        uses: actions/checkout@v4
        with:
          repository: Celechron/Celechron
          ref: c6256031e84f0a0ed0c044e93f4a083ffc45713d
          path: app
          persist-credentials: false

      - name: Apply Windows compatibility changes
        shell: powershell
        run: |
          Copy-Item -Path .\overlay\* -Destination .\app -Recurse -Force
          Copy-Item -LiteralPath .\.github\workflows\windows-build.yml -Destination .\app\.github\workflows\windows-build.yml -Force

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Compile, package, and check startup
        shell: powershell
        run: .\app\scripts\build-windows.ps1

      - name: Upload runnable package and matching source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Celechron-1.3.1-Windows-x64
          path: |
            app/dist/Celechron-1.3.1-Windows-x64.zip
            app/dist/Celechron-1.3.1-Windows-source.zip
            app/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Celechron-Windows-build-logs
          path: app/dist/logs/
          if-no-files-found: warn
          retention-days: 14
